# ================================================
# Linear MAE 2D — global linear ridge / elastic-style baseline
# Same data + masking as MAE_2D_full; metrics and temporal plots aligned with MAE 2D.
# Usage: PYTHONPATH=. python scripts/train_linear_mae_2d.py --config configs/linear_mae_2d_full.yaml
# ================================================

model: linear_mae_2d
channels: 1
# Optional explicit [H, W] after patch trimming; if omitted, inferred from stats_json mean_shape
# or default (100,100) then aligned to patch_size multiples.
linear_spatial_hw: null

normalize_loss: true
crop_loss: null
crop_loss_radius: 30
loss_type: "mse"
alpha: 0.84
ssim_window_size: 11
ssim_sigma: 1.5
# L1 penalty on Linear weights (elastic-net-style with AdamW weight_decay as L2). 0 = pure ridge.
linear_l1_penalty: 0.0

# --- Data (match MAE_2D_full paths; adjust for your machine) ---
dataset_name: vsd_mae
split_csv_path: "Data/FoundationData/ProcessedData/splits/split_v2_seed17_session_split.csv"
stats_json_path: "Data/FoundationData/ProcessedData/splits/baseline_stats_v2_seed17_session_split.json"
processed_root: "Data/FoundationData/ProcessedData/splits"
frame_start: 30
frame_end: 100
clip_length: 1
mask_ratio: 0.5
patch_size: [1, 8, 8]
crop_frame: null
crop_radius: null
val_frame_stride: 1
batch_size: 16
num_workers: 4
pin_memory: true
persistent_workers: true
prefetch_factor: 2

# --- Training (linear layer is large; moderate LR, ridge via weight_decay) ---
lr: 5.0e-3
weight_decay: 1.0e-2
epochs: 50
max_grad_norm: 1.0
auto_resume: true
save_metrics_each_epoch: true
use_amp: false
ckpt_dir: ./checkpoints_linear_mae2d
log_dir: logs_linear_mae2d
seed: 17
preload_into_ram: true
plot_retinotopic: false

# One PNG per temporal metric (plus Trainer’s combined 4-panel plot)
temporal_eval_per_metric_plots: true
